<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KEN-LEE 訓練核對</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #f4f1ea;
      --ink-color: #2c2c2c;
      --accent-color: #b84b4b;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg-color);
      color: var(--ink-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      border-bottom: 2px dashed var(--ink-color);
      padding-bottom: 10px;
      margin-bottom: 25px;
      letter-spacing: 2px;
    }

    .section {
      background: rgba(255, 255, 255, 0.6);
      border: 2px solid var(--ink-color);
      border-radius: 4px;
      padding: 15px 20px;
      margin-bottom: 25px;
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1);
    }

    .section h2 {
      font-size: 1.2rem;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 日期選擇器樣式 */
    #date-picker {
      margin-left: auto;
      font-family: inherit;
      font-size: 1rem;
      padding: 4px 8px;
      border: 1px solid var(--ink-color);
      border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.8);
      color: var(--ink-color);
      cursor: pointer;
    }

    #today-plan { font-size: 1rem; line-height: 1.6; }
    .plan-item { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dotted #ccc; }
    .plan-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .checklist-item { display: flex; align-items: center; margin-bottom: 12px; cursor: pointer; }
    .checklist-item input[type="checkbox"] { display: none; }
    .checklist-item label { display: flex; align-items: center; cursor: pointer; font-size: 1.05rem; transition: color 0.3s; }
    
    .checkbox-custom {
      width: 22px; height: 22px; border: 2px solid var(--ink-color); border-radius: 3px;
      margin-right: 12px; display: flex; justify-content: center; align-items: center; position: relative;
    }

    .checklist-item input[type="checkbox"]:checked + label .checkbox-custom::after {
      content: '✔'; color: var(--accent-color); font-size: 20px; font-weight: bold;
      position: absolute; top: -4px; left: 2px;
    }
    .checklist-item input[type="checkbox"]:checked + label { text-decoration: line-through; color: #888; }

    textarea {
      width: 100%; height: 100px; background: transparent; border: 1px solid #aaa;
      border-radius: 4px; padding: 10px; font-family: inherit; font-size: 1rem;
      resize: vertical; box-sizing: border-box; margin-bottom: 10px;
    }
    textarea:focus { outline: none; border-color: var(--ink-color); background: rgba(255, 255, 255, 0.9); }
    
    .save-btn {
      width: 100%; padding: 12px; font-size: 1.1rem; font-weight: bold;
      background-color: var(--ink-color); color: var(--bg-color); border: none;
      border-radius: 4px; cursor: pointer; transition: background-color 0.3s;
    }
    .save-btn:hover { background-color: #444; }
    .save-btn:disabled { background-color: #888; cursor: not-allowed; }
    
    #status-message { text-align: center; margin-top: 10px; font-size: 0.95rem; font-weight: bold; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <h1>KEN-LEE 訓練核對</h1>

    <div class="section">
      <h2>📅 課表 <input type="date" id="date-picker"></h2>
      <div id="today-plan">
        <p>🔄 正在讀取...</p>
      </div>
    </div>

    <div class="section" id="warmup-section">
      <h2>🏃 跑前動態暖身 (7步驟)</h2>
      <div id="warmup-checklist"></div>
    </div>

    <div class="section">
      <h2>📝 跑後筆記 (體感/配速)</h2>
      <textarea id="run-note" placeholder="例如：今天 10K 體感不錯..."></textarea>
      <button id="save-btn" class="save-btn" onclick="saveNote()">💾 儲存紀錄</button>
      <div id="status-message"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzRw059idz5CNAjomqia4qbXWA04vZv8p3g5kYviZHwkHq515NPKZyT0rmOw4AgOmqi/exec';
    let selectedDateString = ''; // 改為儲存當前選擇的日期

    // ==========================================
    // 1. IndexedDB 核心設定
    // ==========================================
    const DB_NAME = 'RunningTrackerDB';
    const STORE_NAME = 'RunNotes';
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (event) => {
          db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'date' });
          }
        };
        request.onsuccess = (event) => { db = event.target.result; resolve(db); };
        request.onerror = (event) => reject(event.target.error);
      });
    }

    function saveToIndexedDB(date, note) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.put({ date: date, note: note, synced: false });
        request.onsuccess = () => resolve();
        request.onerror = (e) => reject(e.target.error);
      });
    }

    function getFromIndexedDB(date) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(date);
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    // ==========================================
    // 2. 讀取指定日期的課表 (新增休息日隱藏暖身邏輯)
    // ==========================================
    async function fetchPlanByDate() {
      await initDB();
      
      const planDisplay = document.getElementById('today-plan');
      const noteInput = document.getElementById('run-note');
      const datePicker = document.getElementById('date-picker');
      const statusMsg = document.getElementById('status-message');
      const warmupSection = document.getElementById('warmup-section'); // 抓取暖身區塊
      
      // 清空先前的狀態
      noteInput.value = '';
      statusMsg.innerText = '';
      planDisplay.innerHTML = '<p>🔄 正在讀取...</p>';

      // 取得選擇器上的日期並轉換為 MM/DD 格式
      const dateVal = new Date(datePicker.value);
      const month = String(dateVal.getMonth() + 1).padStart(2, '0');
      const day = String(dateVal.getDate()).padStart(2, '0');
      selectedDateString = `${month}/${day}`;

      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        const targetData = data.find(item => item['日期'] === selectedDateString);

        if (targetData) {
          planDisplay.innerHTML = `
            <div class="plan-item"><strong>📌 屬性：</strong> ${targetData['屬性'] || '無'}</div>
            <div class="plan-item"><strong>🎯 主題：</strong> ${targetData['課表主題'] || '無'}</div>
            <div class="plan-item"><strong>📍 距離/內容：</strong> ${targetData['計畫距離/內容'] || '無'}</div>
            <div class="plan-item"><strong>⏱ 預定配速：</strong> ${targetData['目標配速 / 強度區間'] || '無'}</div>
            ${targetData['備註與重點提示'] ? `<div class="plan-item" style="color: var(--accent-color); font-size: 0.9em; margin-top:5px;"><strong>💡 ${targetData['備註與重點提示']}</strong></div>` : ''}
          `;
          if (targetData['實際距離/配速紀錄']) {
             noteInput.value = targetData['實際距離/配速紀錄'];
          }

          // ==========================================
          // 自動隱藏邏輯：如果主題包含「休息」，就隱藏暖身區塊
          // ==========================================
          if (targetData['課表主題'] && targetData['課表主題'].includes('休息')) {
            warmupSection.style.display = 'none';
          } else {
            warmupSection.style.display = 'block'; // 跑步日正常顯示
          }

        } else {
          planDisplay.innerHTML = `<p>✅ 該日 (${selectedDateString}) 無排定課表。</p>`;
          warmupSection.style.display = 'none'; // 沒排課表也預設隱藏
        }
      } catch (error) {
        console.warn('雲端讀取失敗');
        planDisplay.innerHTML = '<p>📴 目前無法載入雲端課表。</p>';
      }

      // 檢查本機 IndexedDB 是否有該日期的筆記
      const localData = await getFromIndexedDB(selectedDateString);
      if (localData && localData.note) {
         noteInput.value = localData.note;
      }
    }
    
    // ==========================================
    // 3. 儲存筆記 (綁定當前選擇的日期)
    // ==========================================
    async function saveNote() {
      const noteInput = document.getElementById('run-note').value.trim();
      const saveBtn = document.getElementById('save-btn');
      const statusMsg = document.getElementById('status-message');

      if (!noteInput) {
        statusMsg.innerText = "⚠️ 請先填寫筆記內容再儲存！";
        statusMsg.style.color = "var(--accent-color)";
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "⏳ 儲存中...";
      statusMsg.innerText = "";

      try {
        await saveToIndexedDB(selectedDateString, noteInput);
        
        saveBtn.innerText = "✔️ 已存入手機";
        saveBtn.style.backgroundColor = "#4b8b5a";
        statusMsg.innerText = "📱 紀錄已保存！正在同步至雲端...";
        statusMsg.style.color = "#4b8b5a";

        const queryParams = new URLSearchParams({
          action: 'save',
          date: selectedDateString,
          note: noteInput
        }).toString();

        const response = await fetch(`${API_URL}?${queryParams}`);
        const result = await response.json();

        if (result.status === 'success') {
           statusMsg.innerText = "✅ 紀錄已同步至 Google 試算表！";
        }
      } catch (error) {
        console.warn('同步失敗', error);
        statusMsg.innerText = "⚠️ 雲端同步失敗，但資料已安全保存在手機中！";
        statusMsg.style.color = "#d97706";
      } finally {
        setTimeout(() => {
          saveBtn.disabled = false;
          saveBtn.innerText = "💾 再次儲存更新";
          saveBtn.style.backgroundColor = "var(--ink-color)";
        }, 3000);
      }
    }

    // ==========================================
    // 4. 初始化：設定預設日期並綁定事件
    // ==========================================
    const warmupSteps = [
      "站姿抱膝 (10-15次)", "站姿抓踝 (10-15次)", "直腿踢 (10-15次)",
      "小腿勺水/滑步勾腳 (10-15次)", "弓箭手轉體 (10-15次)", 
      "側弓步 (10-15次)", "提膝外旋 (10-15次)"
    ];
    const checklistContainer = document.getElementById('warmup-checklist');
    warmupSteps.forEach((step, index) => {
      const item = document.createElement('div');
      item.className = 'checklist-item';
      item.innerHTML = `<input type="checkbox" id="step-${index}"><label for="step-${index}"><span class="checkbox-custom"></span>${step}</label>`;
      checklistContainer.appendChild(item);
    });

    // 網頁載入時，將日期選擇器預設為「今天」，並執行讀取
    window.addEventListener('DOMContentLoaded', () => {
      const datePicker = document.getElementById('date-picker');
      const today = new Date();
      
      // 設定 input[type="date"] 的格式必須是 YYYY-MM-DD
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      datePicker.value = `${yyyy}-${mm}-${dd}`;
      
      // 當使用者改變日期時，重新讀取課表
      datePicker.addEventListener('change', fetchPlanByDate);
      
      // 首次載入執行
      fetchPlanByDate();
    });

    // 註冊 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW 註冊失敗', err));
      });
    }
  </script>
</body>
</html>
