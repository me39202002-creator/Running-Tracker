<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KEN-LEE 訓練核對</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- 引入 SheetJS 函式庫，讓 APP 能直接讀取 Excel 檔案 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-color: #f4f1ea;
      --ink-color: #2c2c2c;
      --accent-color: #b84b4b;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg-color);
      color: var(--ink-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      border-bottom: 2px dashed var(--ink-color);
      padding-bottom: 10px;
      margin-bottom: 25px;
      letter-spacing: 2px;
    }

    .section {
      background: rgba(255, 255, 255, 0.6);
      border: 2px solid var(--ink-color);
      border-radius: 4px;
      padding: 15px 20px;
      margin-bottom: 25px;
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1);
    }

    .section h2 {
      font-size: 1.2rem;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 日期選擇器樣式 */
    #date-picker {
      margin-left: auto;
      font-family: inherit;
      font-size: 1rem;
      padding: 4px 8px;
      border: 1px solid var(--ink-color);
      border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.8);
      color: var(--ink-color);
      cursor: pointer;
    }

    #today-plan { font-size: 1rem; line-height: 1.6; }
    .plan-item { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dotted #ccc; }
    .plan-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .checklist-item { display: flex; align-items: center; margin-bottom: 12px; cursor: pointer; }
    .checklist-item input[type="checkbox"] { display: none; }
    .checklist-item label { display: flex; align-items: center; cursor: pointer; font-size: 1.05rem; transition: color 0.3s; }
    
    .checkbox-custom {
      width: 22px; height: 22px; border: 2px solid var(--ink-color); border-radius: 3px;
      margin-right: 12px; display: flex; justify-content: center; align-items: center; position: relative;
    }

    .checklist-item input[type="checkbox"]:checked + label .checkbox-custom::after {
      content: '✔'; color: var(--accent-color); font-size: 20px; font-weight: bold;
      position: absolute; top: -4px; left: 2px;
    }
    .checklist-item input[type="checkbox"]:checked + label { text-decoration: line-through; color: #888; }

    textarea {
      width: 100%; height: 100px; background: transparent; border: 1px solid #aaa;
      border-radius: 4px; padding: 10px; font-family: inherit; font-size: 1rem;
      resize: vertical; box-sizing: border-box; margin-bottom: 10px;
    }
    textarea:focus { outline: none; border-color: var(--ink-color); background: rgba(255, 255, 255, 0.9); }
    
    .btn {
      width: 100%; padding: 12px; font-size: 1.1rem; font-weight: bold;
      background-color: var(--ink-color); color: var(--bg-color); border: none;
      border-radius: 4px; cursor: pointer; transition: background-color 0.3s;
    }
    .btn:hover { background-color: #444; }
    .btn:disabled { background-color: #888; cursor: not-allowed; }
    
    #status-message { text-align: center; margin-top: 10px; font-size: 0.95rem; font-weight: bold; }

    /* 匯入區塊樣式 */
    .import-section {
      background: rgba(0, 0, 0, 0.05);
      border: 1px dashed var(--ink-color);
      box-shadow: none;
      padding: 15px;
    }
    input[type="file"] { margin-bottom: 10px; font-family: inherit; font-size: 0.9rem; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <h1>KEN-LEE 訓練核對</h1>

    <!-- 課表顯示區 -->
    <div class="section">
      <h2>📅 課表 <input type="date" id="date-picker"></h2>
      <div id="today-plan">
        <p>🔄 正在讀取...</p>
      </div>
    </div>

    <!-- 動態暖身區 -->
    <div class="section" id="warmup-section">
      <h2>🏃 跑前動態暖身 (7步驟)</h2>
      <div id="warmup-checklist"></div>
    </div>

    <!-- 訓練筆記區 -->
    <div class="section">
      <h2>📝 訓練筆記</h2>
      <textarea id="run-note" placeholder="例如：今天 10K 體感不錯..."></textarea>
      <button id="save-btn" class="btn" onclick="saveNote()">💾 儲存紀錄至手機</button>
      <div id="status-message"></div>
    </div>

    <!-- 系統設定區 (放在最下方避免干擾日常使用) -->
    <div class="section import-section">
      <h2 style="font-size: 1rem;">⚙️ 系統設定 (匯入課表)</h2>
      
      <div style="background-color: rgba(255,255,255,0.7); padding: 10px; border-radius: 4px; margin-bottom: 15px; border: 1px solid #ccc;">
        <p style="font-size: 0.9rem; margin-top: 0; font-weight: bold;">📝 步驟 1：下載並填寫課表</p>
        <a href="./跑步訓練計畫表(空白).xlsx" download="跑步訓練計畫表(空白).xlsx" style="display: inline-block; text-decoration: none; color: var(--bg-color); background-color: var(--accent-color); padding: 6px 12px; border-radius: 4px; font-size: 0.9rem; margin-bottom: 5px;">📥 下載 Excel 空白範本</a>
        <p style="font-size: 0.8rem; color: #555; margin-bottom: 0;">直接在 Excel 填寫完畢後存檔即可，無須轉換格式。</p>
      </div>

      <p style="font-size: 0.9rem; margin-top: 0; font-weight: bold;">📂 步驟 2：載入 Excel 檔案</p>
      <input type="file" id="excel-file" accept=".xlsx, .xls, .csv">
      <button class="btn" style="background-color: #555;" onclick="importExcel()">📥 載入 Excel 檔案</button>
    </div>
  </div>

  <script>
    let selectedDateString = ''; 

    // ==========================================
    // 1. IndexedDB 離線資料庫設定
    // ==========================================
    const DB_NAME = 'RunningTrackerOfflineDB';
    const STORE_NAME = 'RunData';
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (event) => {
          db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: '日期' });
          }
        };
        request.onsuccess = (event) => { db = event.target.result; resolve(db); };
        request.onerror = (event) => reject(event.target.error);
      });
    }

    function getFromDB(date) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(date);
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    function saveToDB(dataObj) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.put(dataObj);
        request.onsuccess = () => resolve();
        request.onerror = (e) => reject(e.target.error);
      });
    }

    // ==========================================
    // 2. 核心功能：讀取指定日期的課表
    // ==========================================
    async function fetchPlanByDate() {
      await initDB();
      
      const planDisplay = document.getElementById('today-plan');
      const noteInput = document.getElementById('run-note');
      const datePicker = document.getElementById('date-picker');
      const statusMsg = document.getElementById('status-message');
      const warmupSection = document.getElementById('warmup-section');
      
      noteInput.value = '';
      statusMsg.innerText = '';
      planDisplay.innerHTML = '<p>🔄 正在讀取...</p>';

      const dateVal = new Date(datePicker.value);
      const month = String(dateVal.getMonth() + 1).padStart(2, '0');
      const day = String(dateVal.getDate()).padStart(2, '0');
      selectedDateString = `${month}/${day}`;

      try {
        const targetData = await getFromDB(selectedDateString);

        if (targetData) {
          planDisplay.innerHTML = `
            <div class="plan-item"><strong>📌 屬性：</strong> ${targetData['屬性'] || '無'}</div>
            <div class="plan-item"><strong>🎯 主題：</strong> ${targetData['課表主題'] || '無'}</div>
            <div class="plan-item"><strong>📍 距離/內容：</strong> ${targetData['計畫距離/內容'] || '無'}</div>
            <div class="plan-item"><strong>⏱ 預定配速：</strong> ${targetData['目標配速 / 強度區間'] || '無'}</div>
            ${targetData['備註與重點提示'] ? `<div class="plan-item" style="color: var(--accent-color); font-size: 0.9em; margin-top:5px;"><strong>💡 ${targetData['備註與重點提示']}</strong></div>` : ''}
          `;
          
          if (targetData['實際距離/配速紀錄']) {
             noteInput.value = targetData['實際距離/配速紀錄'];
          }

          if (targetData['課表主題'] && targetData['課表主題'].includes('休息')) {
            warmupSection.style.display = 'none';
          } else {
            warmupSection.style.display = 'block'; 
          }
        } else {
          planDisplay.innerHTML = `<p>✅ 該日 (${selectedDateString}) 無排定課表，或尚未匯入資料。</p>`;
          warmupSection.style.display = 'none'; 
        }
      } catch (error) {
        planDisplay.innerHTML = '<p>❌ 讀取資料庫失敗。</p>';
      }
    }

    // ==========================================
    // 3. 儲存訓練筆記
    // ==========================================
    async function saveNote() {
      const noteInput = document.getElementById('run-note').value.trim();
      const saveBtn = document.getElementById('save-btn');
      const statusMsg = document.getElementById('status-message');

      if (!noteInput) {
        statusMsg.innerText = "⚠️ 請先填寫筆記內容再儲存！";
        statusMsg.style.color = "var(--accent-color)";
        return;
      }

      try {
        let existingData = await getFromDB(selectedDateString) || { '日期': selectedDateString };
        
        existingData['實際距離/配速紀錄'] = noteInput;
        existingData['完成狀態'] = '✔️'; 

        await saveToDB(existingData);
        
        saveBtn.innerText = "✔️ 已存入手機";
        saveBtn.style.backgroundColor = "#4b8b5a";
        statusMsg.innerText = "✅ 紀錄已安全保存在本機端！";
        statusMsg.style.color = "#4b8b5a";

      } catch (error) {
        statusMsg.innerText = "❌ 儲存失敗！";
        statusMsg.style.color = "var(--accent-color)";
      } finally {
        setTimeout(() => {
          saveBtn.innerText = "💾 儲存紀錄至手機";
          saveBtn.style.backgroundColor = "var(--ink-color)";
        }, 2000);
      }
    }

    // ==========================================
    // 4. 解析與匯入 Excel 檔案 (使用 SheetJS)
    // ==========================================
    async function importExcel() {
      const fileInput = document.getElementById('excel-file');
      if (!fileInput.files.length) {
        alert('請先選擇一個 Excel 檔案！');
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          
          const dataArray = XLSX.utils.sheet_to_json(worksheet, { defval: "", raw: false });

          if (dataArray.length === 0) {
            alert('解析失敗或檔案為空！');
            return;
          }

          await initDB();
          
          for (const row of dataArray) {
            if (row['日期'] && String(row['日期']).includes('/')) {
              let dateStr = String(row['日期']).trim();
              const dateParts = dateStr.split('/');
              if(dateParts.length === 2) {
                 row['日期'] = `${dateParts[0].padStart(2, '0')}/${dateParts[1].padStart(2, '0')}`;
              }
              await saveToDB(row);
            }
          }
          alert('🎉 課表匯入成功！資料已儲存至手機。');
          fetchPlanByDate(); 
        } catch (error) {
          alert('解析 Excel 檔案時發生錯誤：' + error);
        }
      };

      reader.readAsArrayBuffer(file);
    }

    // ==========================================
    // 5. 初始化與事件綁定
    // ==========================================
    const warmupSteps = [
      "站姿抱膝 (10-15次)", "站姿抓踝 (10-15次)", "直腿踢 (10-15次)",
      "小腿勺水/滑步勾腳 (10-15次)", "弓箭手轉體 (10-15次)", 
      "側弓步 (10-15次)", "提膝外旋 (10-15次)"
    ];
    const checklistContainer = document.getElementById('warmup-checklist');
    warmupSteps.forEach((step, index) => {
      const item = document.createElement('div');
      item.className = 'checklist-item';
      item.innerHTML = `<input type="checkbox" id="step-${index}"><label for="step-${index}"><span class="checkbox-custom"></span>${step}</label>`;
      checklistContainer.appendChild(item);
    });

    window.addEventListener('DOMContentLoaded', () => {
      const datePicker = document.getElementById('date-picker');
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      datePicker.value = `${yyyy}-${mm}-${dd}`;
      
      datePicker.addEventListener('change', fetchPlanByDate);
      fetchPlanByDate();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW 失敗', err));
      });
    }
  </script>
</body>
</html>
