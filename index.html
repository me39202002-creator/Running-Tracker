<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跑步訓練紀錄</title>
  <link rel="manifest" href="manifest.json">
  
  <link rel="icon" type="image/png" href="./Icon.png">
  <link rel="apple-touch-icon" href="./Icon.png">
  
  <!-- 引入 SheetJS 函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-color: #f4f1ea;
      --ink-color: #2c2c2c;
      --accent-color: #b84b4b;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg-color);
      color: var(--ink-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
    }

    .container { width: 100%; max-width: 500px; }

    h1 {
      font-size: 1.8rem; text-align: center; border-bottom: 2px dashed var(--ink-color);
      padding-bottom: 10px; margin-bottom: 25px; letter-spacing: 2px;
    }

    .section {
      background: rgba(255, 255, 255, 0.6); border: 2px solid var(--ink-color);
      border-radius: 4px; padding: 15px 20px; margin-bottom: 25px;
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1);
    }

    .section h2 { font-size: 1.2rem; margin-top: 0; display: flex; align-items: center; gap: 8px; }

    #date-picker {
      margin-left: auto; font-family: inherit; font-size: 1rem; padding: 4px 8px;
      border: 1px solid var(--ink-color); border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.8); color: var(--ink-color); cursor: pointer;
    }

    #today-plan { font-size: 1rem; line-height: 1.6; }
    .plan-item { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dotted #ccc; }
    .plan-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .checklist-item { display: flex; align-items: center; margin-bottom: 12px; cursor: pointer; }
    .checklist-item input[type="checkbox"] { display: none; }
    .checklist-item label { display: flex; align-items: center; cursor: pointer; font-size: 1.05rem; transition: color 0.3s; }
    
    .checkbox-custom {
      width: 22px; height: 22px; border: 2px solid var(--ink-color); border-radius: 3px;
      margin-right: 12px; display: flex; justify-content: center; align-items: center; position: relative;
    }
    .checklist-item input[type="checkbox"]:checked + label .checkbox-custom::after {
      content: '✔'; color: var(--accent-color); font-size: 20px; font-weight: bold; position: absolute; top: -4px; left: 2px;
    }
    .checklist-item input[type="checkbox"]:checked + label { text-decoration: line-through; color: #888; }

    textarea {
      width: 100%; height: 100px; background: transparent; border: 1px solid #aaa;
      border-radius: 4px; padding: 10px; font-family: inherit; font-size: 1rem;
      resize: vertical; box-sizing: border-box; margin-bottom: 10px;
    }
    textarea:focus { outline: none; border-color: var(--ink-color); background: rgba(255, 255, 255, 0.9); }
    
    .btn {
      width: 100%; padding: 12px; font-size: 1.1rem; font-weight: bold;
      background-color: var(--ink-color); color: var(--bg-color); border: none;
      border-radius: 4px; cursor: pointer; transition: background-color 0.3s;
    }
    .btn:hover { background-color: #444; }
    .btn:disabled { background-color: #888; cursor: not-allowed; }
    
    #status-message { text-align: center; margin-top: 10px; font-size: 0.95rem; font-weight: bold; }

    .import-section { background: rgba(0, 0, 0, 0.05); border: 1px dashed var(--ink-color); box-shadow: none; padding: 15px; }
    .tab-nav { display: flex; border-bottom: 2px solid var(--ink-color); margin-bottom: 15px; }
    .tab-btn {
      flex: 1; background: transparent; border: none; padding: 8px 5px; font-size: 0.95rem;
      font-weight: bold; color: #888; cursor: pointer; transition: color 0.3s, border-bottom 0.3s;
      outline: none; font-family: inherit;
    }
    .tab-btn.active { color: var(--ink-color); border-bottom: 3px solid var(--accent-color); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .mode-box { background-color: rgba(255,255,255,0.7); padding: 15px; border-radius: 4px; border: 1px solid #ccc; }
    
    .ai-select {
      width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #aaa;
      font-family: inherit; font-size: 1rem; box-sizing: border-box; background-color: #fff;
    }

    /* === 新增：微型互動日曆專屬樣式 === */
    .calendar-container {
      background: rgba(255, 255, 255, 0.9); border: 1px solid #aaa; border-radius: 4px;
      padding: 10px; margin-bottom: 10px; display: none; /* 預設隱藏，切換模式才顯示 */
    }
    .calendar-header { text-align: center; font-weight: bold; margin-bottom: 8px; color: var(--ink-color); font-size: 1rem; letter-spacing: 1px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal-day-name { font-size: 0.8rem; color: #888; font-weight: bold; margin-bottom: 4px; }
    .cal-cell {
      padding: 8px 0; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;
      font-size: 0.95rem; background: #fff; transition: all 0.2s; user-select: none;
    }
    .cal-cell:hover:not(.empty) { background: #f4f1ea; border-color: var(--ink-color); }
    .cal-cell.empty { background: transparent; border: none; cursor: default; }
    .cal-cell.selected {
      background: var(--accent-color); color: var(--bg-color); border-color: var(--accent-color); font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>跑步訓練紀錄</h1>

    <div class="section">
      <h2>📅 課表 <input type="date" id="date-picker"></h2>
      <div id="today-plan"><p>🔄 正在讀取...</p></div>
    </div>

    <div class="section" id="warmup-section">
      <h2>🏃 跑前動態暖身 (7步驟)</h2>
      <div id="warmup-checklist"></div>
    </div>

    <div class="section">
      <h2>📝 訓練筆記</h2>
      <textarea id="run-note" placeholder="例如：今天 10K 體感不錯..."></textarea>
      <button id="save-btn" class="btn" onclick="saveNote()">💾 儲存紀錄至手機</button>
      <div id="status-message"></div>
    </div>

    <div class="section import-section">
      <h2 style="font-size: 1.1rem; margin-bottom: 10px;">⚙️ 系統設定 (管理課表)</h2>
      
      <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('tab-local', this)">📂 檔案匯入</button>
        <button class="tab-btn" onclick="switchTab('tab-cloud', this)">☁️ 雲端同步</button>
        <button class="tab-btn" onclick="switchTab('tab-ai', this)">🤖 AI 安排</button>
      </div>

      <!-- 頁籤 1：本機檔案 -->
      <div id="tab-local" class="tab-pane active mode-box">
        <p style="font-size: 0.8rem; color: #555; margin-top: 0; margin-bottom: 10px;">選擇手機內的 Excel 或 CSV 檔案。</p>
        <a href="./跑步訓練計畫表(空白).xlsx" download="跑步訓練計畫表(空白).xlsx" style="display: inline-block; text-decoration: none; color: var(--bg-color); background-color: var(--accent-color); padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; margin-bottom: 12px;">📥 下載 Excel 空白範本</a>
        <br>
        <input type="file" id="excel-file" accept="*/*" style="font-size: 0.9rem; margin-bottom: 10px; width: 100%;">
        <button class="btn" style="background-color: #555; padding: 10px; font-size: 1rem;" onclick="importExcel()">載入所選檔案</button>
      </div>

      <!-- 頁籤 2：雲端網址同步 -->
      <div id="tab-cloud" class="tab-pane mode-box">
        <p style="font-size: 0.8rem; color: #555; margin-top: 0; margin-bottom: 10px;">貼上 Google 試算表「發布到網路 (CSV)」的連結。</p>
        <input type="text" id="sync-url" placeholder="貼上 https://docs.google.com/..." style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #aaa; border-radius: 4px; box-sizing: border-box; font-family: inherit;">
        <button class="btn" id="sync-btn" style="background-color: #4b8b5a; padding: 10px; font-size: 1rem;" onclick="syncFromCloud()">🔄 立即同步最新課表</button>
      </div>

      <!-- 頁籤 3：AI 助理 (新增互動日曆) -->
      <div id="tab-ai" class="tab-pane mode-box">
        <p style="font-size: 0.85rem; color: #333; margin-top: 0; margin-bottom: 10px; font-weight: bold;">讓 AI 直接為您產生整個月的訓練試算表！</p>
        
        <select id="ai-distance" class="ai-select">
          <option value="5K">目標：5K 訓練計畫</option>
          <option value="10K" selected>目標：10K 訓練計畫</option>
          <option value="半馬(21K)">目標：半馬(21K) 訓練計畫</option>
          <option value="全馬(42K)">目標：全馬(42K) 訓練計畫</option>
          <option value="健康維持">目標：日常健康維持跑</option>
        </select>
        
        <input type="month" id="ai-month" class="ai-select">

        <!-- 【全新功能】排表模式切換 -->
        <select id="ai-schedule-mode" class="ai-select" onchange="toggleScheduleMode()" style="border: 2px solid var(--ink-color);">
          <option value="weekly">📅 排表方式：依每週天數</option>
          <option value="custom">🖱️ 排表方式：自訂具體訓練日期</option>
        </select>

        <!-- 模式A：每週天數選單 -->
        <select id="ai-days" class="ai-select">
          <option value="2">每週訓練：2 天</option>
          <option value="3">每週訓練：3 天</option>
          <option value="4" selected>每週訓練：4 天</option>
          <option value="5">每週訓練：5 天</option>
          <option value="6">每週訓練：6 天</option>
        </select>

        <!-- 模式B：互動微型日曆 -->
        <div id="custom-date-picker" class="calendar-container">
          <div class="calendar-header" id="cal-month-label"></div>
          <div class="calendar-grid" id="cal-grid"></div>
          <p style="font-size: 0.75rem; color: #555; text-align: center; margin-top: 8px; margin-bottom: 0;">👆 請點擊上方日期，選擇您預定要跑步的日子</p>
        </div>

        <select id="ai-pace" class="ai-select">
          <option value="">平日配速：不指定 (由 AI 評估)</option>
          <option value="4:30 - 5:00">平日配速：4:30 - 5:00 /km</option>
          <option value="5:00 - 5:30">平日配速：5:00 - 5:30 /km</option>
          <option value="5:30 - 6:00" selected>平日配速：5:30 - 6:00 /km</option>
          <option value="6:00 - 6:30">平日配速：6:00 - 6:30 /km</option>
          <option value="6:30 - 7:00">平日配速：6:30 - 7:00 /km</option>
          <option value="7:00 - 8:00">平日配速：7:00 - 8:00 /km</option>
        </select>

        <button class="btn" style="background-color: #2b5b84; padding: 10px; font-size: 1rem; margin-bottom: 10px;" onclick="generateAIPrompt()">✨ 產生 AI 教練指令</button>
        
        <textarea id="ai-prompt-output" readonly style="height: 140px; font-size: 0.85rem; color: #555; display: none; margin-bottom: 10px;"></textarea>
        <button id="copy-btn" class="btn" style="background-color: #4b8b5a; padding: 10px; font-size: 1rem; display: none;" onclick="copyPrompt()">📋 複製指令 (前往 ChatGPT/Gemini)</button>
      </div>

      <!-- 重設資料庫按鈕 -->
      <div style="text-align: right; margin-top: 15px;">
        <button class="btn" style="background-color: #888; padding: 6px 12px; font-size: 0.85rem; width: auto;" onclick="clearScheduleOnly()">🧹 清除舊課表 (保留筆記)</button>
      </div>

    </div>
  </div>

  <script>
    let selectedDateString = ''; 
    let selectedCustomDates = new Set(); // 儲存使用者在日曆上點選的日期

    // UI 控制：分頁切換
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    // UI 控制：切換排表模式 (每週天數 vs 自訂日期)
    function toggleScheduleMode() {
      const mode = document.getElementById('ai-schedule-mode').value;
      if (mode === 'weekly') {
        document.getElementById('ai-days').style.display = 'block';
        document.getElementById('custom-date-picker').style.display = 'none';
      } else {
        document.getElementById('ai-days').style.display = 'none';
        document.getElementById('custom-date-picker').style.display = 'block';
        renderCalendar(); // 切換時自動渲染日曆
      }
    }

    // ==========================================
    // 渲染微型日曆功能
    // ==========================================
    function renderCalendar() {
      const monthVal = document.getElementById('ai-month').value;
      if (!monthVal) return;
      const parts = monthVal.split('-');
      const yyyy = parseInt(parts[0], 10);
      const mm = parseInt(parts[1], 10);

      document.getElementById('cal-month-label').innerText = `${yyyy}年 ${mm}月`;
      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '';

      const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
      dayNames.forEach(d => {
        const div = document.createElement('div');
        div.className = 'cal-day-name';
        div.innerText = d;
        grid.appendChild(div);
      });

      const firstDay = new Date(yyyy, mm - 1, 1).getDay();
      const daysInMonth = new Date(yyyy, mm, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-cell empty';
        grid.appendChild(empty);
      }

      selectedCustomDates.clear(); // 切換月份時清空已選日期

      for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        cell.innerText = d;
        const dateStr = `${String(mm).padStart(2, '0')}/${String(d).padStart(2, '0')}`;
        
        cell.onclick = function() {
          if (cell.classList.contains('selected')) {
            cell.classList.remove('selected');
            selectedCustomDates.delete(dateStr);
          } else {
            cell.classList.add('selected');
            selectedCustomDates.add(dateStr);
          }
        };
        grid.appendChild(cell);
      }
    }

    // ==========================================
    // IndexedDB 離線資料庫
    // ==========================================
    const DB_NAME = 'RunningTrackerOfflineDB';
    const STORE_NAME = 'RunData';
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (event) => {
          db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: '日期' });
        };
        request.onsuccess = (event) => { db = event.target.result; resolve(db); };
        request.onerror = (event) => reject(event.target.error);
      });
    }

    function getFromDB(date) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(date);
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    function saveToDB(dataObj) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.put(dataObj);
        request.onsuccess = () => resolve();
        request.onerror = (e) => reject(e.target.error);
      });
    }

    // 清除舊課表 (保留筆記)
    async function clearScheduleOnly() {
      if (confirm('確定要清除舊的課表嗎？\n\n（別擔心，您寫過的「訓練筆記」與「完成狀態」將會被安全保留！）')) {
        await initDB();
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.openCursor();

        request.onsuccess = (event) => {
          const cursor = event.target.result;
          if (cursor) {
            const data = cursor.value;
            if (data['實際距離/配速紀錄'] || data['完成狀態'] === '✔️️') {
              const keepData = {
                '日期': data['日期'],
                '實際距離/配速紀錄': data['實際距離/配速紀錄'] || '',
                '完成狀態': data['完成狀態'] || ''
              };
              cursor.update(keepData); 
            } else {
              cursor.delete();
            }
            cursor.continue();
          } else {
            alert('🧹 舊課表已清除，您的訓練筆記已安全保留！請重新同步最新課表。');
            fetchPlanByDate(); 
          }
        };
        request.onerror = () => { alert('❌ 清除失敗，請稍後再試。'); };
      }
    }

    // ==========================================
    // 讀取指定日期的課表
    // ==========================================
    async function fetchPlanByDate() {
      await initDB();
      const planDisplay = document.getElementById('today-plan');
      const noteInput = document.getElementById('run-note');
      const datePicker = document.getElementById('date-picker');
      const warmupSection = document.getElementById('warmup-section');
      
      noteInput.value = '';
      planDisplay.innerHTML = '<p>🔄 正在讀取...</p>';

      const dateVal = new Date(datePicker.value);
      const month = String(dateVal.getMonth() + 1).padStart(2, '0');
      const day = String(dateVal.getDate()).padStart(2, '0');
      selectedDateString = `${month}/${day}`;

      try {
        const targetData = await getFromDB(selectedDateString);
        if (targetData) {
          const attr = targetData['屬性'] || '無';
          const topic = targetData['課表主題'] || '無';
          const dist = targetData['計畫距離/內容'] || targetData['計畫距離 / 內容'] || '無';
          const pace = targetData['目標配速/強度區間'] || targetData['目標配速 / 強度區間'] || '無';
          const note = targetData['備註與重點提示'] || targetData['備註'] || '';

          planDisplay.innerHTML = `
            <div class="plan-item"><strong>📌 屬性：</strong> ${attr}</div>
            <div class="plan-item"><strong>🎯 主題：</strong> ${topic}</div>
            <div class="plan-item"><strong>📍 距離/內容：</strong> ${dist}</div>
            <div class="plan-item"><strong>⏱ 預定配速：</strong> ${pace}</div>
            ${note ? `<div class="plan-item" style="color: var(--accent-color); font-size: 0.9em; margin-top:5px;"><strong>💡 ${note}</strong></div>` : ''}
          `;
          
          if (targetData['實際距離/配速紀錄']) noteInput.value = targetData['實際距離/配速紀錄'];
          
          if (targetData['課表主題'] && targetData['課表主題'].includes('休息')) {
            warmupSection.style.display = 'none';
          } else {
            warmupSection.style.display = 'block'; 
          }
        } else {
          planDisplay.innerHTML = `<p>✅ 該日 (${selectedDateString}) 無排定課表，或尚未匯入資料。</p>`;
          warmupSection.style.display = 'none'; 
        }
      } catch (error) {
        planDisplay.innerHTML = '<p>❌ 讀取資料庫失敗。</p>';
      }
    }

    async function saveNote() {
      const noteInput = document.getElementById('run-note').value.trim();
      const saveBtn = document.getElementById('save-btn');
      const statusMsg = document.getElementById('status-message');

      if (!noteInput) {
        statusMsg.innerText = "⚠️ 請先填寫筆記內容再儲存！"; statusMsg.style.color = "var(--accent-color)"; return;
      }

      try {
        let existingData = await getFromDB(selectedDateString) || { '日期': selectedDateString };
        existingData['實際距離/配速紀錄'] = noteInput;
        existingData['完成狀態'] = '✔️'; 
        await saveToDB(existingData);
        
        saveBtn.innerText = "✔️ 已存入手機"; saveBtn.style.backgroundColor = "#4b8b5a";
        statusMsg.innerText = "✅ 紀錄已安全保存在本機端！"; statusMsg.style.color = "#4b8b5a";
      } catch (error) {
        statusMsg.innerText = "❌ 儲存失敗！"; statusMsg.style.color = "var(--accent-color)";
      } finally {
        setTimeout(() => { saveBtn.innerText = "💾 儲存紀錄至手機"; saveBtn.style.backgroundColor = "var(--ink-color)"; statusMsg.innerText = ""; }, 2000);
      }
    }

    // ==========================================
    // 檔案與雲端匯入邏輯
    // ==========================================
    function normalizeDate(rawDateStr) {
      if (!rawDateStr) return null;
      if (!isNaN(rawDateStr) && Number(rawDateStr) > 30000) {
        const date = new Date(Math.round((Number(rawDateStr) - 25569) * 86400 * 1000));
        return `${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
      }
      let dStr = String(rawDateStr).trim().replace(/-/g, '/');
      let parts = dStr.split('/');
      
      if (parts.length === 3) {
        if (parts[0].length === 4) return `${parts[1].padStart(2, '0')}/${parts[2].substring(0,2).padStart(2, '0')}`;
        else return `${parts[0].padStart(2, '0')}/${parts[1].substring(0,2).padStart(2, '0')}`;
      } else if (parts.length === 2) {
        return `${parts[0].padStart(2, '0')}/${parts[1].substring(0,2).padStart(2, '0')}`;
      }
      return null;
    }

    async function importExcel() {
      const fileInput = document.getElementById('excel-file');
      if (!fileInput.files.length) { alert('請先選擇檔案！'); return; }

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: "", raw: false });

          let headerIndex = rows.findIndex(r => r.some(c => String(c).includes('日期')));
          if(headerIndex === -1) { alert('⚠️ 找不到包含「日期」的標題列。'); return; }

          let headers = rows[headerIndex].map(h => String(h).trim());
          
          await initDB();
          let count = 0;
          for (let i = headerIndex + 1; i < rows.length; i++) {
            if (rows[i].length < 2) continue; 
            
            let rowObj = {};
            headers.forEach((h, idx) => { rowObj[h] = rows[i][idx] ? String(rows[i][idx]).trim() : ''; });

            let standardDate = normalizeDate(rowObj['日期']);
            if (standardDate) {
              rowObj['日期'] = standardDate;
              let existingData = await getFromDB(standardDate);
              if (existingData && existingData['實際距離/配速紀錄']) {
                 rowObj['實際距離/配速紀錄'] = existingData['實際距離/配速紀錄']; 
                 rowObj['完成狀態'] = existingData['完成狀態'];
              }
              await saveToDB(rowObj);
              count++;
            }
          }
          if(count > 0){ alert(`🎉 成功匯入並更新 ${count} 天的訓練計畫！`); fetchPlanByDate(); } 
          else { alert('⚠️ 沒有找到符合的資料，請確認檔案內容。'); }
          fileInput.value = ''; 
        } catch (error) { alert('解析失敗：' + error); }
      };
      reader.readAsArrayBuffer(fileInput.files[0]);
    }

    async function syncFromCloud() {
      const urlInput = document.getElementById('sync-url').value.trim();
      const syncBtn = document.getElementById('sync-btn');
      if (!urlInput) { alert("⚠️ 請貼上連結！"); return; }
      if (!urlInput.toLowerCase().includes('csv')) {
        alert("⚠️ 網址格式不正確！\n\n請確認在 Google 試算表點擊「發布到網路」時，下拉選單有改選為「逗號分隔值 (.csv)」。"); return;
      }

      localStorage.setItem('RunningApp_SyncURL', urlInput);
      syncBtn.disabled = true; syncBtn.innerText = "⏳ 同步中...";

      try {
        const response = await fetch(urlInput);
        if (!response.ok) throw new Error("網路連線異常");
        const text = await response.text();
        const workbook = XLSX.read(text, { type: 'string' });
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: "", raw: false });

        let headerIndex = rows.findIndex(r => r.some(c => String(c).includes('日期')));
        if(headerIndex === -1) { alert('⚠️ 雲端資料找不到包含「日期」的標題列。'); return; }

        let headers = rows[headerIndex].map(h => String(h).trim());
        
        await initDB();
        let count = 0;
        for (let i = headerIndex + 1; i < rows.length; i++) {
          if (rows[i].length < 2) continue;
          let rowObj = {};
          headers.forEach((h, idx) => { rowObj[h] = rows[i][idx] ? String(rows[i][idx]).trim() : ''; });

          let standardDate = normalizeDate(rowObj['日期']);
          if (standardDate) {
            rowObj['日期'] = standardDate;
            let existingData = await getFromDB(standardDate);
            if (existingData && existingData['實際距離/配速紀錄']) {
               rowObj['實際距離/配速紀錄'] = existingData['實際距離/配速紀錄']; 
               rowObj['完成狀態'] = existingData['完成狀態'];
            }
            await saveToDB(rowObj);
            count++;
          }
        }
        if (count > 0) { alert(`🎉 雲端同步成功！已更新 ${count} 天的訓練計畫！`); fetchPlanByDate(); } 
        else { alert('⚠️ 雲端連線成功，但沒有找到符合的日期資料。'); }
      } catch (error) {
        alert('同步失敗：請確認網址是否正確，錯誤資訊：' + error.message);
      } finally {
        syncBtn.disabled = false; syncBtn.innerText = "🔄 立即同步最新課表";
      }
    }

    // ==========================================
    // 5. AI 教練指令產生器 (支援自訂日曆選擇)
    // ==========================================
    function generateAIPrompt() {
      const distance = document.getElementById('ai-distance').value;
      const monthVal = document.getElementById('ai-month').value;
      const mode = document.getElementById('ai-schedule-mode').value;
      const pace = document.getElementById('ai-pace').value;
      
      let yyyy = "****", mm = "**";
      if (monthVal) {
        const parts = monthVal.split('-');
        yyyy = parts[0]; mm = parts[1];
      }

      let pacePrompt = pace ? `我目前的平日跑步配速大約是 ${pace}，請根據這個基礎來安排適合的各區間目標配速。` : "";
      let schedulePrompt = "";

      if (mode === 'weekly') {
        const days = document.getElementById('ai-days').value;
        schedulePrompt = `每週請安排 ${days} 天訓練，其餘天數安排休息。`;
      } else {
        if (selectedCustomDates.size === 0) {
          alert("⚠️ 請在日曆上點擊選擇您預定要跑步的日期！");
          return;
        }
        const sortedDates = Array.from(selectedCustomDates).sort();
        schedulePrompt = `我預定在這個月的以下指定日期進行訓練：\n${sortedDates.join(', ')}\n請「只在」這些指定的日期安排訓練課表，其餘未指定的日期請全部安排為「休息」。`;
      }

      const promptTemplate = `請幫我建立一份 [${yyyy}年${mm}月] 的 [${distance}跑步訓練計畫表] 試算表檔案。
${schedulePrompt}
${pacePrompt}
內容請包含以下欄位：日期、星期、屬性、課表主題、計畫距離/內容、目標配速/強度區間、完成狀態、實際距離/配速紀錄、備註與重點提示。
請直接幫我輸出成試算表格式。`;

      const outputArea = document.getElementById('ai-prompt-output');
      const copyBtn = document.getElementById('copy-btn');
      
      outputArea.value = promptTemplate;
      outputArea.style.display = 'block';
      copyBtn.style.display = 'block';
    }

    function copyPrompt() {
      const outputArea = document.getElementById('ai-prompt-output');
      outputArea.select();
      document.execCommand('copy');
      const copyBtn = document.getElementById('copy-btn');
      copyBtn.innerText = "✔️ 已複製！請貼給 ChatGPT/Gemini";
      setTimeout(() => { copyBtn.innerText = "📋 複製指令 (前往 ChatGPT/Gemini)"; }, 3000);
    }

    // ==========================================
    // 6. 初始化與事件綁定
    // ==========================================
    const warmupSteps = ["站姿抱膝", "站姿抓踝", "直腿踢", "小腿勺水/滑步勾腳", "弓箭步轉體", "側壓腿", "站姿股四頭肌伸展"];
    const checklistContainer = document.getElementById('warmup-checklist');
    warmupSteps.forEach((step, index) => {
      checklistContainer.innerHTML += `<div class="checklist-item"><input type="checkbox" id="step-${index}"><label for="step-${index}"><span class="checkbox-custom"></span>${step}</label></div>`;
    });

    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      document.getElementById('date-picker').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      document.getElementById('date-picker').addEventListener('change', fetchPlanByDate);
      fetchPlanByDate();

      const currentMonthVal = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
      document.getElementById('ai-month').value = currentMonthVal;
      
      // 當使用者變更月份時，同步重新渲染日曆
      document.getElementById('ai-month').addEventListener('change', () => {
        if (document.getElementById('ai-schedule-mode').value === 'custom') {
          renderCalendar();
        }
      });

      const savedUrl = localStorage.getItem('RunningApp_SyncURL');
      if (savedUrl) document.getElementById('sync-url').value = savedUrl;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW 註冊失敗', err)); });
    }
  </script>
